# Keep edge workers alive for EdgeRuntime.waitUntil background tasks (REQ-01 memory extraction).
[edge_runtime]
policy = "per_worker"

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/reset_pw",
  "http://localhost:3000/reset_pw",
]

[auth.email]
# Dev: skip confirmation emails (built-in SMTP allows only 2/hour project-wide).
# Production: enable confirmations + custom SMTP — see supabase/EMAIL_TEMPLATES.md (US-606).
