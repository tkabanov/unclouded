<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Unclouded — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f8fa;
        --fg: #1a2b30;
        --muted: #5b6b70;
        --accent: #087fc4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1a20;
          --fg: #eef5f7;
          --muted: #9fb0b5;
          --accent: #35a6e8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.4;
      }
      button {
        appearance: none;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 10px;
        min-height: 44px;
        min-width: 44px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Unclouded needs a connection to load. Check your network and try again.</p>
      <button id="retry" type="button">Retry</button>
    </div>
    <script>
      // MOB-03: reload the shell (server.url) once connectivity looks restored,
      // either via explicit retry tap or the WebView's own "online" event —
      // this local page never depends on the Capacitor bridge being present.
      function reload() {
        window.location.reload();
      }
      document.getElementById("retry").addEventListener("click", reload);
      window.addEventListener("online", reload);
    </script>
  </body>
</html>
